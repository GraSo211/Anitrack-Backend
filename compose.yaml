services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=anitrack-db'
      - 'POSTGRES_PASSWORD=2110'
      - 'POSTGRES_USER=admin'
    ports:
      - '5431:5432'
  backend:
    build: .
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/anitrack-db'
      - 'SPRING_DATASOURCE_USERNAME=admin'
      - 'SPRING_DATASOURCE_PASSWORD=2110'